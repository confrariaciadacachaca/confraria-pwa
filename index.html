<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Identidade Confraria</title>

  <link rel="manifest" href="./manifest.json?v=6">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Identidade Confraria">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111111;
      font-family: Arial, Helvetica, sans-serif;
      color: #123A2F;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 1180px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================================================
       CARTEIRA
       ========================================================= */

    .wallet {
      width: 100%;
      aspect-ratio: 1.586 / 1;
      position: relative;
      perspective: 1600px;
    }

    .wallet-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s ease;
    }

    .wallet.flipped .wallet-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      backface-visibility: hidden;
      background: #F5F1E8;
      border: 1px solid rgba(181, 138, 44, 0.65);
      box-shadow:
        0 20px 50px rgba(0,0,0,0.30),
        inset 0 0 0 1px rgba(255,255,255,0.35);
    }

    .back {
      transform: rotateY(180deg);
    }

    /* =========================================================
       FAIXAS DECORATIVAS
       ========================================================= */

    .corner {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }

    .corner.top-right {
      top: 0;
      right: 0;
      width: 175px;
      height: 105px;
      background:
        linear-gradient(
          145deg,
          transparent 0%,
          transparent 43%,
          #123A2F 43%,
          #123A2F 100%
        );
    }

    .corner.top-right::after {
      content: "";
      position: absolute;
      right: 20px;
      top: 0;
      width: 135px;
      height: 2px;
      background: #B58A2C;
      transform: rotate(-38deg);
      transform-origin: right center;
    }

    .corner.bottom-left {
      left: 0;
      bottom: 0;
      width: 175px;
      height: 105px;
      background:
        linear-gradient(
          145deg,
          #123A2F 0%,
          #123A2F 57%,
          transparent 57%,
          transparent 100%
        );
    }

    .corner.bottom-left::after {
      content: "";
      position: absolute;
      left: 20px;
      bottom: 0;
      width: 135px;
      height: 2px;
      background: #B58A2C;
      transform: rotate(-38deg);
      transform-origin: left center;
    }

    /* =========================================================
       FRENTE
       ========================================================= */

    .front-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 74px;
      z-index: 5;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border-bottom: 1px solid rgba(107, 74, 43, 0.20);

      background: rgba(245, 241, 232, 0.97);
    }

    .front-title {
      font-size: clamp(18px, 2.05vw, 27px);
      font-weight: 700;
      letter-spacing: 1.2px;
      line-height: 1;
      white-space: nowrap;
      color: #123A2F;
      text-align: center;
    }

    .front-subtitle {
      margin-top: 7px;
      font-size: clamp(8px, 0.72vw, 11px);
      letter-spacing: 2px;
      color: #B58A2C;
      text-transform: uppercase;
    }

    .front-content {
      position: absolute;
      z-index: 4;

      top: 74px;
      bottom: 0;
      left: 0;
      right: 0;

      display: grid;

      /*
        Foto | identificação | informações
        A distribuição foi ampliada para ocupar melhor
        a área útil da carteira.
      */
      grid-template-columns: 31% 39% 30%;

      align-items: center;
      padding: 30px 48px 32px 58px;
    }

    /* =========================================================
       FOTO
       ========================================================= */

    .photo-area {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 6px;
    }

    .photo-frame {
      width: 190px;
      height: 215px;

      max-width: 88%;
      max-height: 78%;

      border-radius: 15px;
      overflow: hidden;

      border: 2px solid #B58A2C;

      background: #ddd;

      box-shadow:
        0 12px 25px rgba(0,0,0,0.16),
        0 0 0 5px rgba(181,138,44,0.08);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* =========================================================
       IDENTIFICAÇÃO CENTRAL
       ========================================================= */

    .identity {
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 8px 15px 4px;
    }

    .member-name {
      font-size: clamp(28px, 3vw, 39px);
      line-height: 1.05;
      font-weight: 700;
      color: #123A2F;
      margin-bottom: 7px;
      white-space: nowrap;
    }

    .member-role {
      font-size: clamp(15px, 1.25vw, 19px);
      color: #111111;
      margin-bottom: 7px;
    }

    .member-number {
      font-size: clamp(12px, 1vw, 15px);
      color: #6B4A2B;
      margin-bottom: 12px;
    }

    .status {
      min-width: 82px;
      padding: 6px 17px;

      border-radius: 30px;

      background: #DCEEE8;
      color: #006B58;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;

      margin-bottom: 13px;
    }

    .motto {
      font-size: clamp(11px, 0.9vw, 14px);
      letter-spacing: 1.7px;
      color: #B58A2C;
      text-transform: uppercase;
      margin-bottom: 13px;
      white-space: nowrap;
    }

    .front-logo {
      width: 150px;
      max-width: 75%;
      height: 72px;

      object-fit: contain;
      display: block;
    }

    /* =========================================================
       INFORMAÇÕES / QR
       ========================================================= */

    .details {
      height: 100%;

      border-left: 1px solid rgba(107, 74, 43, 0.30);

      padding-left: 28px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .detail-row {
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 9px 0;

      border-bottom: 1px solid rgba(107, 74, 43, 0.18);

      font-size: 12px;
    }

    .detail-label {
      color: #6B4A2B;
    }

    .detail-value {
      color: #123A2F;
      font-weight: 700;
      text-align: right;
    }

    .qr-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      margin-top: 17px;
    }

    .qr-area img {
      width: 110px;
      height: 110px;

      object-fit: contain;

      background: #FFFFFF;
      padding: 5px;

      border: 1px solid rgba(17,17,17,0.15);
    }

    .qr-caption {
      margin-top: 7px;

      font-size: 8px;
      letter-spacing: 0.7px;
      color: #6B4A2B;

      text-align: center;
      white-space: nowrap;
    }

    /* =========================================================
       VERSO
       ========================================================= */

    .back-content {
      position: absolute;
      inset: 0;
      z-index: 4;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;
    }

    .back-logo {
      width: 390px;
      max-width: 42%;
      height: 210px;

      object-fit: contain;

      margin-top: -8px;
    }

    .back-motto {
      margin-top: -3px;

      font-size: clamp(12px, 1vw, 15px);
      letter-spacing: 2.1px;

      color: #B58A2C;

      text-transform: uppercase;
    }

    /* =========================================================
       CONTROLES
       ========================================================= */

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 1px solid #B58A2C;

      border-radius: 30px;

      padding: 9px 22px;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      background: transparent;
      color: #F5F1E8;

      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .share-button {
      background: #B58A2C;
      color: #FFFFFF;
    }

    .app-info {
      margin-top: 9px;

      text-align: center;

      font-size: 8px;
      line-height: 1.45;

      color: #F5F1E8;
      opacity: 0.85;
    }

    .portrait-warning {
      display: none;
    }

    /* =========================================================
       CARREGANDO / ERRO
       ========================================================= */

    .loading {
      min-height: 300px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #F5F1E8;
      font-size: 14px;
    }

    .error-box {
      background: #F5F1E8;
      color: #123A2F;

      border-radius: 16px;

      padding: 30px;

      max-width: 430px;

      text-align: center;

      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .error-box h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .error-box p {
      margin: 8px 0;
      color: #6B4A2B;
      font-size: 13px;
    }

    /* =========================================================
       RESPONSIVO
       ========================================================= */

    @media (max-width: 900px) {

      body {
        padding: 10px;
      }

      .wallet {
        aspect-ratio: auto;
        height: auto;
        min-height: 620px;
      }

      .front-header {
        height: 78px;
      }

      .front-title {
        font-size: 17px;
        letter-spacing: 0.8px;
      }

      .front-subtitle {
        font-size: 8px;
        letter-spacing: 1.4px;
      }

      .front-content {
        top: 78px;

        display: grid;

        grid-template-columns: 32% 38% 30%;

        padding:
          28px
          28px
          28px
          32px;
      }

      .photo-frame {
        width: 150px;
        height: 180px;
      }

      .member-name {
        font-size: 27px;
      }

      .member-role {
        font-size: 14px;
      }

      .front-logo {
        width: 125px;
      }

      .details {
        padding-left: 17px;
      }

      .detail-row {
        font-size: 10px;
      }

      .qr-area img {
        width: 88px;
        height: 88px;
      }

      .qr-caption {
        font-size: 6px;
      }

      .back-logo {
        max-width: 48%;
        height: 180px;
      }
    }

    @media (max-width: 650px) {

      body {
        padding: 8px;
      }

      .wallet {
        min-height: 700px;
      }

      .front-header {
        height: 82px;
      }

      .front-title {
        font-size: 14px;
        white-space: normal;
        max-width: 90%;
        line-height: 1.15;
      }

      .front-subtitle {
        font-size: 7px;
        margin-top: 5px;
      }

      .front-content {
        top: 82px;
        display: flex;
        flex-direction: column;

        justify-content: center;

        gap: 18px;

        padding: 30px 25px;
      }

      .photo-area {
        flex: none;
      }

      .photo-frame {
        width: 125px;
        height: 150px;
      }

      .identity {
        height: auto;
        flex: none;
      }

      .member-name {
        font-size: 25px;
      }

      .member-role {
        font-size: 14px;
      }

      .member-number {
        font-size: 11px;
      }

      .motto {
        font-size: 9px;
        letter-spacing: 1.2px;
      }

      .front-logo {
        width: 110px;
        height: 55px;
      }

      .details {
        height: auto;
        width: 90%;

        border-left: none;
        border-top: 1px solid rgba(107,74,43,0.30);

        padding:
          12px
          0
          0;
      }

      .detail-row {
        padding: 6px 0;
      }

      .qr-area {
        margin-top: 10px;
      }

      .qr-area img {
        width: 82px;
        height: 82px;
      }

      .corner.top-right {
        width: 110px;
        height: 72px;
      }

      .corner.top-right::after {
        width: 88px;
        height: 2px;
        right: 12px;
      }

      .corner.bottom-left {
        width: 110px;
        height: 72px;
      }

      .corner.bottom-left::after {
        width: 88px;
        height: 2px;
        left: 12px;
      }

      .back-logo {
        width: 270px;
        max-width: 65%;
        height: 150px;
      }

      .back-motto {
        font-size: 9px;
        letter-spacing: 1.4px;
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <div id="appContent" class="loading">
      Carregando carteira...
    </div>

  </div>


<script>

  /* =========================================================
     CONFIGURAÇÃO
     ========================================================= */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyBiHc666uXQ0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec";


  /* =========================================================
     NÚMERO DO MEMBRO
     ========================================================= */

  function obterNumeroMembro() {

    const params = new URLSearchParams(window.location.search);

    let numero = params.get("membro");

    if (!numero) {
      numero = localStorage.getItem("confraria_membro");
    }

    if (!numero) {
      numero = "0001";
    }

    numero = String(numero).padStart(4, "0");

    localStorage.setItem("confraria_membro", numero);

    return numero;
  }


  /* =========================================================
     API JSONP
     ========================================================= */

  function buscarMembro(numero) {

    return new Promise((resolve, reject) => {

      const callbackName =
        "confrariaCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

      const script = document.createElement("script");

      let finalizado = false;

      const timeout = setTimeout(() => {

        if (finalizado) return;

        finalizado = true;

        cleanup();

        reject(
          new Error("Tempo limite excedido ao consultar a carteira.")
        );

      }, 15000);


      function cleanup() {

        clearTimeout(timeout);

        try {
          delete window[callbackName];
        } catch(e) {
          window[callbackName] = undefined;
        }

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }


      window[callbackName] = function(data) {

        if (finalizado) return;

        finalizado = true;

        cleanup();

        resolve(data);
      };


      script.onerror = function() {

        if (finalizado) return;

        finalizado = true;

        cleanup();

        reject(
          new Error("Não foi possível consultar a carteira.")
        );
      };


      const url =
        API_URL +
        "?api=1" +
        "&membro=" +
        encodeURIComponent(numero) +
        "&callback=" +
        encodeURIComponent(callbackName);


      script.src = url;

      document.body.appendChild(script);

    });

  }


  /* =========================================================
     QR CODE
     ========================================================= */

  function obterQRCode(membro) {

    if (membro.qr) {
      return membro.qr;
    }

    const numero =
      membro.numero ||
      obterNumeroMembro();

    const verificacao =
      API_URL +
      "?membro=" +
      encodeURIComponent(numero);

    return (
      "https://quickchart.io/qr?size=300&margin=1&text=" +
      encodeURIComponent(verificacao)
    );
  }


  /* =========================================================
     CONSTRUIR CARTEIRA
     ========================================================= */

  function construirCarteira(membro) {

    const foto =
      membro.foto ||
      "";

    const logo =
      membro.logo ||
      "";

    const qr =
      obterQRCode(membro);


    const html = `

      <div class="wallet" id="wallet">

        <div class="wallet-inner">


          <!-- =================================================
               FRENTE
               ================================================= -->

          <section class="face front">


            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>


            <header class="front-header">

              <div class="front-title">
                CARTEIRA DE IDENTIFICAÇÃO DA CONFRARIA
              </div>

              <div class="front-subtitle">
                CONFRARIA COMPANHIA DA CACHAÇA
              </div>

            </header>


            <div class="front-content">


              <!-- FOTO -->

              <div class="photo-area">

                <div class="photo-frame">

                  ${
                    foto
                    ?
                    `<img src="${foto}" alt="Foto do membro">`
                    :
                    ""
                  }

                </div>

              </div>


              <!-- IDENTIFICAÇÃO -->

              <div class="identity">

                <div class="member-name">
                  ${membro.nome || ""}
                </div>

                <div class="member-role">
                  ${membro.cargo || ""}
                </div>

                <div class="member-number">
                  ${membro.tratamento || "Confrade"} nº ${membro.numero || ""}
                </div>

                <div class="status">
                  ${membro.status || "ATIVO"}
                </div>

                <div class="motto">
                  HONRA · TRADIÇÃO · PAIXÃO
                </div>

                ${
                  logo
                  ?
                  `<img
                    class="front-logo"
                    src="${logo}"
                    alt="Confraria Companhia da Cachaça"
                  >`
                  :
                  ""
                }

              </div>


              <!-- INFORMAÇÕES -->

              <div class="details">


                <div class="detail-row">

                  <span class="detail-label">
                    Condição
                  </span>

                  <span class="detail-value">
                    ${membro.condicao || ""}
                  </span>

                </div>


                <div class="detail-row">

                  <span class="detail-label">
                    Biênio
                  </span>

                  <span class="detail-value">
                    ${membro.bienio || ""}
                  </span>

                </div>


                <div class="detail-row">

                  <span class="detail-label">
                    Ingresso
                  </span>

                  <span class="detail-value">
                    ${membro.ingresso || ""}
                  </span>

                </div>


                <div class="detail-row">

                  <span class="detail-label">
                    Validade
                  </span>

                  <span class="detail-value">
                    ${membro.validade || ""}
                  </span>

                </div>


                <div class="qr-area">

                  <img
                    src="${qr}"
                    alt="QR Code de autenticação"
                  >

                  <div class="qr-caption">
                    VERIFIQUE A AUTENTICIDADE
                  </div>

                </div>


              </div>


            </div>

          </section>



          <!-- =================================================
               VERSO
               ================================================= -->

          <section class="face back">


            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>


            <div class="back-content">

              ${
                logo
                ?
                `<img
                  class="back-logo"
                  src="${logo}"
                  alt="Confraria Companhia da Cachaça"
                >`
                :
                ""
              }

              <div class="back-motto">
                HONRA · TRADIÇÃO · PAIXÃO
              </div>

            </div>


          </section>


        </div>

      </div>


      <div class="controls">

        <button
          type="button"
          onclick="alternarLado()"
          id="flipButton"
        >
          Ver verso
        </button>

        <button
          type="button"
          class="share-button"
          onclick="compartilharCarteira()"
        >
          Compartilhar
        </button>

      </div>


      <div class="app-info">
        <strong>Identidade Confraria</strong><br>
        Confraria Companhia da Cachaça
      </div>

    `;


    document.getElementById("appContent").outerHTML =
      `<div class="app" id="mainApp">${html}</div>`;

  }


  /* =========================================================
     ALTERNAR FRENTE / VERSO
     ========================================================= */

  function alternarLado() {

    const wallet =
      document.getElementById("wallet");

    const button =
      document.getElementById("flipButton");

    if (!wallet) return;

    wallet.classList.toggle("flipped");

    if (wallet.classList.contains("flipped")) {

      button.textContent = "Ver frente";

    } else {

      button.textContent = "Ver verso";

    }

  }


  /* =========================================================
     COMPARTILHAR
     ========================================================= */

  async function compartilharCarteira() {

    const url =
      window.location.href;

    const texto =
      "Identidade Confraria — Confraria Companhia da Cachaça";


    if (
      navigator.share
    ) {

      try {

        await navigator.share({
          title: "Identidade Confraria",
          text: texto,
          url: url
        });

        return;

      } catch(e) {}

    }


    try {

      await navigator.clipboard.writeText(url);

      alert(
        "Link da carteira copiado para a área de transferência."
      );

    } catch(e) {

      prompt(
        "Copie o link da carteira:",
        url
      );

    }

  }


  /* =========================================================
     ERRO
     ========================================================= */

  function mostrarErro(mensagem) {

    document.getElementById("appContent").outerHTML = `

      <div class="error-box">

        <h2>
          Carteira não encontrada
        </h2>

        <p>
          ${mensagem}
        </p>

        <p>
          Verifique o número informado.
        </p>

      </div>

    `;

  }


  /* =========================================================
     INICIAR
     ========================================================= */

  async function iniciar() {

    const numero =
      obterNumeroMembro();

    try {

      const membro =
        await buscarMembro(numero);


      if (
        !membro ||
        membro.erro
      ) {

        throw new Error(
          membro?.mensagem ||
          "Carteira não encontrada."
        );

      }


      construirCarteira(membro);


    } catch(e) {

      console.error(e);

      mostrarErro(
        e.message ||
        "Não foi possível consultar a carteira."
      );

    }

  }


  /* =========================================================
     SERVICE WORKER
     ========================================================= */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker.register(
          "./service-worker.js?v=6"
