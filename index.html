<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <meta
    name="description"
    content="Carteira Digital da Confraria Companhia da Cachaça"
  >

  <link
    rel="manifest"
    href="./manifest.json?v=5"
  >

  <title>Identidade Confraria</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {

      padding: 22px 15px;

      background: #111111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #123A2F;

      overflow-x: hidden;

    }


    /* =====================================================
       ÁREA PRINCIPAL
       ===================================================== */

    .area-carteira {

      width: 100%;

      max-width: 1080px;

      margin: 0 auto;

    }


    .carteira {

      width: 100%;

      aspect-ratio: 1.586 / 1;

      position: relative;

    }


    .cartao {

      width: 100%;

      height: 100%;

      position: relative;

    }


    .face {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      background: #F5F1E8;

      border: 1px solid #D4C9B6;

      border-radius: 18px;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.32);

      overflow: hidden;

    }


    /* =====================================================
       FRENTE
       ===================================================== */

    .frente {

      display: flex;

      flex-direction: column;

    }


    /* =====================================================
       CABEÇALHO
       ===================================================== */

    .cabecalho {

      position: relative;

      z-index: 5;

      padding:
        15px 24px 10px;

      text-align: center;

      border-bottom:
        1px solid #D8D0C2;

    }


    .titulo {

      font-size: 19px;

      font-weight: 700;

      letter-spacing: 1px;

      color: #123A2F;

      white-space: nowrap;

      line-height: 1.15;

    }


    .subtitulo {

      margin-top: 5px;

      font-size: 9px;

      letter-spacing: 1.35px;

      color: #B58A2C;

      line-height: 1;

    }


    /* =====================================================
       CORPO
       ===================================================== */

    .corpo {

      position: relative;

      z-index: 2;

      flex: 1;

      display: grid;

      /*
       * Os três blocos ficam mais próximos:
       *
       * FOTO | IDENTIFICAÇÃO | DADOS
       */

      grid-template-columns:
        27%
        43%
        30%;

      align-items: center;

      padding:
        13px
        24px
        17px;

      overflow: hidden;

    }


    /* =====================================================
       FAIXAS GEOMÉTRICAS
       ===================================================== */

    .corpo::before,
    .corpo::after {

      content: "";

      position: absolute;

      pointer-events: none;

      z-index: 0;

    }


    .corpo::before {

      top: 0;

      left: 0;

      width: 140px;

      height: 100px;

      background: #123A2F;

      clip-path: polygon(
        0 0,
        100% 0,
        0 100%
      );

    }


    .corpo::after {

      right: 0;

      bottom: 0;

      width: 140px;

      height: 100px;

      background: #123A2F;

      clip-path: polygon(
        100% 100%,
        0 100%,
        100% 0
      );

    }


    .corpo {

      background:

        linear-gradient(
          146deg,
          transparent 0%,
          transparent 47%,
          #B58A2C 47%,
          #B58A2C 51%,
          transparent 51%
        )
        top left / 140px 100px
        no-repeat,

        linear-gradient(
          326deg,
          transparent 0%,
          transparent 47%,
          #B58A2C 47%,
          #B58A2C 51%,
          transparent 51%
        )
        bottom right / 140px 100px
        no-repeat;

    }


    .coluna-foto,
    .coluna-central,
    .coluna-direita {

      position: relative;

      z-index: 3;

      min-width: 0;

    }


    /* =====================================================
       FOTO
       ===================================================== */

    .coluna-foto {

      display: flex;

      align-items: center;

      justify-content: center;

      padding-right: 2px;

      transform:
        translateX(8px);

    }


    .foto {

      width: 170px;

      height: 194px;

      object-fit: cover;

      object-position: center center;

      border-radius: 11px;

      border:
        2px solid #B58A2C;

      display: block;

      max-width: 100%;

      box-shadow:
        0 7px 17px rgba(0,0,0,0.18);

    }


    .foto.vertical {

      object-position: center 20%;

    }


    .foto.vertical-extrema {

      object-position: center 15%;

    }


    .foto.horizontal {

      object-position: center center;

    }


    .foto.quadrada {

      object-position: center center;

    }


    .sem-foto {

      width: 170px;

      height: 194px;

      border:
        2px solid #B58A2C;

      border-radius: 11px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #8A8377;

      font-size: 13px;

      background: #EFE8DA;

    }


    /* =====================================================
       BLOCO CENTRAL
       ===================================================== */

    .coluna-central {

      text-align: center;

      padding:
        0 7px;

      transform:
        translateX(0)
        translateY(-1px);

    }


    .nome {

      font-size: 30px;

      font-weight: 700;

      color: #123A2F;

      letter-spacing: 0;

      line-height: 1.05;

      width: 100%;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: clip;

      margin: 0 auto;

    }


    .cargo {

      margin-top: 6px;

      font-size: 16px;

      color: #333333;

      line-height: 1.15;

    }


    .numero {

      margin-top: 7px;

      font-size: 13px;

      color: #806C51;

      line-height: 1.1;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      margin-top: 10px;

      padding:
        6px 20px;

      min-width: 72px;

      border-radius: 20px;

      background: #DCEEE6;

      color: #12614D;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.8px;

      line-height: 1;

    }


    /* =====================================================
       LEMA
       ===================================================== */

    .lema {

      margin-top: 11px;

      font-size: 9px;

      letter-spacing: 1px;

      color: #B58A2C;

      white-space: nowrap;

    }


    /* =====================================================
       LOGO DA FRENTE
       ===================================================== */

    .logo-frente {

      display: block;

      width: auto;

      height: auto;

      max-width: 142px;

      max-height: 66px;

      object-fit: contain;

      margin:
        10px auto 0;

    }


    .logo-frente.logo-oculta {

      display: none;

    }


    /* =====================================================
       COLUNA DIREITA
       ===================================================== */

    .coluna-direita {

      border-left:
        1px solid #D8D0C2;

      padding-left: 18px;

      padding-right: 2px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: stretch;

    }


    .dados {

      width: 100%;

    }


    .linha {

      display: flex;

      justify-content: space-between;

      align-items: center;

      min-height: 35px;

      border-bottom:
        1px solid #E1DBD0;

      font-size: 11px;

      gap: 10px;

    }


    .rotulo {

      color: #806C51;

      white-space: nowrap;

    }


    .valor {

      color: #123A2F;

      font-weight: 700;

      text-align: right;

      white-space: nowrap;

    }


    /* =====================================================
       QR CODE
       ===================================================== */

    .qr-area {

      margin-top: 13px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

    }


    .qr {

      width: 94px;

      height: 94px;

      object-fit: contain;

      border:
        1px solid #D8D0C2;

      border-radius: 4px;

      background: #FFFFFF;

      padding: 2px;

      display: block;

    }


    .qr-texto {

      margin-top: 4px;

      font-size: 7px;

      letter-spacing: 0.45px;

      color: #6F685D;

      white-space: nowrap;

      text-align: center;

    }


    /* =====================================================
       VERSO
       ===================================================== */

    .verso {

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      text-align: center;

      background: #F5F1E8;

    }


    /* =====================================================
       ELEMENTOS DO VERSO
       ===================================================== */

    .verso::before,
    .verso::after {

      content: "";

      position: absolute;

      pointer-events: none;

    }


    .verso::before {

      top: -115px;

      left: -90px;

      width: 260px;

      height: 225px;

      background: #123A2F;

      transform:
        rotate(-34deg);

      box-shadow:
        24px 16px 0 #B58A2C;

    }


    .verso::after {

      right: -95px;

      bottom: -110px;

      width: 260px;

      height: 225px;

      background: #123A2F;

      transform:
        rotate(-34deg);

      box-shadow:
        -24px -16px 0 #B58A2C;

    }


    /* =====================================================
       LOGO DO VERSO
       ===================================================== */

    .logo-verso {

      position: relative;

      z-index: 3;

      display: block;

      width: auto;

      height: auto;

      max-width: 360px;

      max-height: 190px;

      object-fit: contain;

      margin:
        -8px 0 0;

    }


    .lema-verso {

      position: relative;

      z-index: 3;

      margin-top: 13px;

      color: #B58A2C;

      font-size: 13px;

      letter-spacing: 1.8px;

      line-height: 1.2;

    }


    /* =====================================================
       CONTROLES
       ===================================================== */

    .controles {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      margin-top: 14px;

    }


    .botao {

      display: block;

      padding:
        8px 18px;

      border:
        1px solid #B58A2C;

      border-radius: 20px;

      background: transparent;

      color: #F5F1E8;

      font-size: 11px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;

    }


    .botao:hover {

      background: #123A2F;

    }


    .botao:active {

      transform:
        scale(0.97);

    }


    .botao-compartilhar {

      background: #B58A2C;

      border-color: #B58A2C;

      color: #FFFFFF;

    }


    .botao-compartilhar:hover {

      background: #9D7725;

    }


    /* =====================================================
       IDENTIFICAÇÃO DO APP
       ===================================================== */

    .identificacao-app {

      margin-top: 8px;

      text-align: center;

      color:
        rgba(245,241,232,0.72);

      font-size: 9px;

      line-height: 1.4;

    }


    .identificacao-app strong {

      display: block;

      color:
        rgba(245,241,232,0.90);

      font-weight: 500;

    }


    /* =====================================================
       CARREGAMENTO
       ===================================================== */

    .carregando {

      width: 100%;

      min-height: 65vh;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      text-align: center;

      color: #F5F1E8;

    }


    .carregando-titulo {

      font-size: 21px;

      color: #B58A2C;

      font-weight: 700;

      margin-bottom: 10px;

    }


    .carregando-texto {

      font-size: 14px;

      color: #F5F1E8;

      opacity: 0.8;

    }


    /* =====================================================
       ERRO
       ===================================================== */

    .erro {

      width: 100%;

      max-width: 430px;

      margin: 60px auto;

      padding: 35px 25px;

      background: #F5F1E8;

      border:
        1px solid #D9D0BF;

      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.10);

    }


    .erro h2 {

      margin:
        0 0 12px;

      color: #123A2F;

      font-size: 21px;

    }


    .erro p {

      color: #666666;

      font-size: 14px;

      line-height: 1.5;

    }


    /* =====================================================
       AVISO RETRATO
       ===================================================== */

    .aviso-retrato {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 9999;

      background: #111111;

      color: #F5F1E8;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;

    }


    .aviso-retrato-conteudo {

      max-width: 340px;

    }


    .aviso-retrato-titulo {

      color: #B58A2C;

      font-size: 21px;

      font-weight: 700;

      margin-bottom: 12px;

    }


    .aviso-retrato-texto {

      font-size: 14px;

      line-height: 1.5;

      opacity: 0.85;

    }


    /* =====================================================
       RESPONSIVO
       ===================================================== */

    @media (max-width: 650px) {

      body {

        padding:
          20px 10px;

      }


      .titulo {

        font-size: 14px;

      }


      .subtitulo {

        font-size: 8px;

      }


      .corpo {

        grid-template-columns:
          27% 44% 29%;

        padding:
          12px 11px;

      }


      .corpo::before,
      .corpo::after {

        width: 110px;

        height: 82px;

      }


      .coluna-foto {

        transform:
          translateX(5px);

      }


      .foto,
      .sem-foto {

        width: 88px;

        height: 108px;

      }


      .coluna-central {

        padding:
          0 5px;

      }


      .nome {

        font-size: 18px;

      }


      .cargo {

        font-size: 12px;

      }


      .numero {

        font-size: 9px;

      }


      .status {

        font-size: 8px;

        padding:
          5px 12px;

      }


      .lema {

        font-size: 7px;

      }


      .logo-frente {

        max-width: 82px;

        max-height: 38px;

      }


      .coluna-direita {

        padding-left: 8px;

      }


      .linha {

        min-height: 23px;

        font-size: 7px;

      }


      .qr {

        width: 64px;

        height: 64px;

      }


      .qr-texto {

        font-size: 6px;

      }


      .logo-verso {

        max-width: 70%;

        max-height: 125px;

      }


      .lema-verso {

        font-size: 8px;

      }

    }


    /* =====================================================
       RETRATO NO CELULAR
       ===================================================== */

    @media
      (max-width: 650px)
      and (orientation: portrait) {

      .aviso-retrato {

        display: flex;

      }

    }


    /* =====================================================
       TELAS BAIXAS
       ===================================================== */

    @media (max-height: 600px) {

      body {

        padding-top: 10px;

        padding-bottom: 10px;

      }


      .controles {

        margin-top: 8px;

      }


      .identificacao-app {

        margin-top: 5px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       AVISO PARA CELULAR EM RETRATO
       ===================================================== -->

  <div
    class="aviso-retrato"
    id="avisoRetrato"
  >

    <div class="aviso-retrato-conteudo">

      <div class="aviso-retrato-titulo">
        Identidade Confraria
      </div>

      <div class="aviso-retrato-texto">
        Para visualizar sua carteira digital,
        gire o celular para a posição horizontal.
      </div>

    </div>

  </div>


  <!-- =====================================================
       CONTEÚDO
       ===================================================== -->

  <div id="conteudo">

    <div
      class="carregando"
      id="carregando"
    >

      <div class="carregando-titulo">
        Identidade Confraria
      </div>

      <div class="carregando-texto">
        Carregando carteira digital...
      </div>

    </div>

  </div>


  <script>


    /* =====================================================
       CONFIGURAÇÕES
       ===================================================== */


    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyBiHc666uXQ0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec";


    const STORAGE_KEY =
      "confraria_membro";


    /* =====================================================
       NÚMERO DO MEMBRO
       ===================================================== */

    function obterNumeroMembro() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );


      let numero =
        parametros.get("membro");


      if (!numero) {

        numero =
          localStorage.getItem(
            STORAGE_KEY
          );

      }


      if (!numero) {

        numero = "0001";

      }


      numero =
        String(numero)
          .replace(/\D/g, "")
          .padStart(4, "0");


      localStorage.setItem(
        STORAGE_KEY,
        numero
      );


      return numero;

    }


    /* =====================================================
       CONSULTA JSONP
       ===================================================== */

    function buscarMembro(numero) {

      return new Promise(
        function(resolve, reject) {

          const callbackName =
            "confrariaCallback_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 100000
            );


          const script =
            document.createElement(
              "script"
            );


          let finalizado =
            false;


          const timeout =
            setTimeout(
              function() {

                if (finalizado) {
                  return;
                }


                finalizado = true;

                limpar();


                reject(
                  new Error(
                    "Tempo limite excedido ao consultar a carteira."
                  )
                );

              },
              15000
            );


          function limpar() {

            clearTimeout(timeout);


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(script);

            }


            try {

              delete window[
                callbackName
              ];

            }

            catch (erro) {

              window[
                callbackName
              ] = undefined;

            }

          }


          window[
            callbackName
          ] =
            function(dados) {

              if (finalizado) {
                return;
              }


              finalizado = true;

              limpar();

              resolve(dados);

            };


          script.onerror =
            function() {

              if (finalizado) {
                return;
              }


              finalizado = true;

              limpar();


              reject(
                new Error(
                  "Não foi possível consultar o servidor da Confraria."
                )
              );

            };


          script.src =
            APP_URL +
            "?api=1" +
            "&membro=" +
            encodeURIComponent(numero) +
            "&callback=" +
            encodeURIComponent(
              callbackName
            ) +
            "&t=" +
            Date.now();


          document.body.appendChild(
            script
          );

        }
      );

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escaparHTML(valor) {

      if (
        valor === null ||
        valor === undefined
      ) {

        return "";

      }


      return String(valor)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       LOGO
       ===================================================== */

    function obterLogo(membro) {

      if (
        membro &&
        membro.logo
      ) {

        return membro.logo;

      }


      return "";

    }


    /* =====================================================
       QR
       ===================================================== */

    function gerarQRCode(link) {

      if (!link) {

        return "";

      }


      return (
        "https://quickchart.io/qr?text=" +
        encodeURIComponent(link) +
        "&size=300&margin=2&format=png"
      );

    }


    /* =====================================================
       CONSTRUIR CARTEIRA
       ===================================================== */

    function construirCarteira(
      membro
    ) {

      const conteudo =
        document.getElementById(
          "conteudo"
        );


      const nome =
        escaparHTML(
          membro.nome || "—"
        );


      const categoria =
        escaparHTML(
          membro.categoria ||
          "Confrade"
        );


      const condicao =
        escaparHTML(
          membro.condicao || ""
        );


      const cargo =
        escaparHTML(
          membro.cargo || ""
        );


      const bienio =
        escaparHTML(
          membro.bienio || ""
        );


      const ingresso =
        escaparHTML(
          membro.ingresso || ""
        );


      const validade =
        escaparHTML(
          membro.validade || ""
        );


      const status =
        escaparHTML(
          membro.status || "ATIVO"
        );


      const numero =
        escaparHTML(
          membro.numero || ""
        );


      const foto =
        membro.foto || "";


      const qr =
        membro.qr ||
        (
          membro.link
            ? gerarQRCode(
                membro.link
              )
            : ""
        );


      const logo =
        obterLogo(membro);


      conteudo.innerHTML = `

        <div class="area-carteira">

          <div class="carteira">

            <div class="cartao">


              <!-- =========================================
                   FRENTE
                   ========================================= -->

              <div
                class="face frente"
                id="frente"
              >


                <div class="cabecalho">

                  <div class="titulo">
                    CARTEIRA DE IDENTIFICAÇÃO DA CONFRARIA
                  </div>

                  <div class="subtitulo">
                    CONFRARIA COMPANHIA DA CACHAÇA
                  </div>

                </div>


                <div class="corpo">


                  <!-- FOTO -->

                  <div class="coluna-foto">

                    ${
                      foto
                        ?

                        `
                        <img
                          class="foto"
                          id="fotoMembro"
                          src="${foto}"
                          alt="Foto do confrade"
                        >
                        `

                        :

                        `
                        <div class="sem-foto">
                          FOTO
                        </div>
                        `
                    }

                  </div>


                  <!-- CENTRO -->

                  <div class="coluna-central">


                    <div
                      class="nome"
                      id="nomeConfrade"
                    >
                      ${nome}
                    </div>


                    ${
                      cargo
                        ?

                        `
                        <div class="cargo">
                          ${cargo}
                        </div>
                        `

                        :
                        ""
                    }


                    <div class="numero">
                      ${categoria} nº ${numero}
                    </div>


                    <div class="status">
                      ${status}
                    </div>


                    <div class="lema">
                      HONRA • TRADIÇÃO • PAIXÃO
                    </div>


                    ${
                      logo
                        ?

                        `
                        <img
                          class="logo-frente"
                          id="logoFrente"
                          src="${logo}"
                          alt="Confraria Companhia da Cachaça"
                        >
                        `

                        :
                        ""
                    }


                  </div>


                  <!-- DADOS -->

                  <div class="coluna-direita">


                    <div class="dados">


                      ${
                        condicao
                          ?

                          `
                          <div class="linha">

                            <span class="rotulo">
                              Condição
                            </span>

                            <span class="valor">
                              ${condicao}
                            </span>

                          </div>
                          `

                          :
                          ""
                      }


                      ${
                        bienio
                          ?

                          `
                          <div class="linha">

                            <span class="rotulo">
                              Biênio
                            </span>

                            <span class="valor">
                              ${bienio}
                            </span>

                          </div>
                          `

                          :
                          ""
                      }


                      ${
                        ingresso
                          ?

                          `
                          <div class="linha">

                            <span class="rotulo">
                              Ingresso
                            </span>

                            <span class="valor">
                              ${ingresso}
                            </span>

                          </div>
                          `

                          :
                          ""
                      }


                      ${
                        validade
                          ?

                          `
                          <div class="linha">

                            <span class="rotulo">
                              Validade
                            </span>

                            <span class="valor">
                              ${validade}
                            </span>

                          </div>
                          `

                          :
                          ""
                      }


                    </div>


                    ${
                      qr
                        ?

                        `
                        <div class="qr-area">

                          <img
                            class="qr"
                            id="qrCode"
                            src="${qr}"
                            alt="QR Code de verificação"
                          >

                          <div class="qr-texto">
                            VERIFIQUE A AUTENTICIDADE
                          </div>

                        </div>
                        `

                        :
                        ""
                    }


                  </div>


                </div>

              </div>


              <!-- =========================================
                   VERSO
                   ========================================= -->

              <div
                class="face verso"
                id="verso"
              >


                ${
                  logo
                    ?

                    `
                    <img
                      class="logo-verso"
                      id="logoVerso"
                      src="${logo}"
                      alt="Confraria Companhia da Cachaça"
                    >
                    `

                    :
                    ""
                }


                <div class="lema-verso">
                  HONRA • TRADIÇÃO • PAIXÃO
                </div>


              </div>


            </div>

          </div>


          <!-- =============================================
               CONTROLES
               ============================================= -->

          <div class="controles">

            <button
              class="botao"
              onclick="alternarLado()"
              id="botaoLado"
            >
              Ver verso
            </button>


            <button
              class="botao botao-compartilhar"
              onclick="compartilharCarteira()"
              id="botaoCompartilhar"
            >
              Compartilhar
            </button>

          </div>


          <div class="identificacao-app">

            <strong>
              Identidade Confraria
            </strong>

            Confraria Companhia da Cachaça

          </div>


        </div>

      `;


      ajustarNome();

      ajustarFoto();

    }


    /* =====================================================
       FOTO
       ===================================================== */

    function ajustarFoto() {

      const foto =
        document.getElementById(
          "fotoMembro"
        );


      if (!foto) {
        return;
      }


      function analisarFoto() {

        const largura =
          foto.naturalWidth;


        const altura =
          foto.naturalHeight;


        if (
          !largura ||
          !altura
        ) {

          return;

        }


        const proporcao =
          largura / altura;


        foto.classList.remove(
          "vertical",
          "vertical-extrema",
          "horizontal",
          "quadrada"
        );


        if (
          proporcao < 0.62
        ) {

          foto.classList.add(
            "vertical-extrema"
          );

        }

        else if (
          proporcao < 0.90
        ) {

          foto.classList.add(
            "vertical"
          );

        }

        else if (
          proporcao > 1.15
        ) {

          foto.classList.add(
            "horizontal"
          );

        }

        else {

          foto.classList.add(
            "quadrada"
          );

        }

      }


      if (
        foto.complete
      ) {

        analisarFoto();

      }


      foto.addEventListener(
        "load",
        analisarFoto,
        {
          once: true
        }
      );

    }


    /* =====================================================
       AJUSTE DO NOME
       ===================================================== */

    function ajustarNome() {

      const nome =
        document.getElementById(
          "nomeConfrade"
        );


      if (!nome) {
        return;
      }


      let tamanho = 30;


      nome.style.fontSize =
        tamanho + "px";


      nome.style.whiteSpace =
        "nowrap";


      while (
        nome.scrollWidth >
        nome.clientWidth &&
        tamanho > 21
      ) {

        tamanho--;

        nome.style.fontSize =
          tamanho + "px";

      }


      if (
        nome.scrollWidth >
        nome.clientWidth
      ) {

        nome.style.whiteSpace =
          "normal";

        nome.style.overflow =
          "visible";

        nome.style.lineHeight =
          "1.08";

      }

    }


    /* =====================================================
       FRENTE / VERSO
       ===================================================== */

    function alternarLado() {

      const frente =
        document.getElementById(
          "frente"
        );


      const verso =
        document.getElementById(
          "verso"
        );


      const botao =
        document.getElementById(
          "botaoLado"
        );


      if (
        !frente ||
        !verso ||
        !botao
      ) {

        return;

      }


      if (
        frente.style.display !==
        "none"
      ) {

        frente.style.display =
          "none";

        verso.style.display =
          "flex";

        botao.textContent =
          "Ver frente";

      }

      else {

        frente.style.display =
          "flex";

        verso.style.display =
          "none";

        botao.textContent =
          "Ver verso";

        ajustarNome();

        ajustarFoto();

      }

    }


    /* =====================================================
       COMPARTILHAR
       ===================================================== */

    async function compartilharCarteira() {

      const url =
        window.location.href;


      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              "Identidade Confraria",

            text:
              "Carteira Digital da Confraria Companhia da Cachaça",

            url:
              url

          });

          return;

        }

        catch (erro) {

          /*
           * Usuário cancelou.
           */

        }

      }


      if (
        navigator.clipboard
      ) {

        try {

          await navigator.clipboard
            .writeText(url);


          const botao =
            document.getElementById(
              "botaoCompartilhar"
            );


          const texto =
            botao.textContent;


          botao.textContent =
            "Link copiado";


          setTimeout(
            function() {

              botao.textContent =
                texto;

            },
            1800
          );


          return;

        }

        catch (erro) {

          /*
           * Fallback abaixo.
           */

        }

      }


      alert(
        "Copie o endereço desta página para compartilhar sua carteira."
      );

    }


    /* =====================================================
       ERRO
       ===================================================== */

    function mostrarErro(
      mensagem
    ) {

      const conteudo =
        document.getElementById(
          "conteudo"
        );


      conteudo.innerHTML = `

        <div class="erro">

          <h2>
            Carteira não encontrada
          </h2>

          <p>
            ${
              escaparHTML(
                mensagem ||
                "Não foi possível carregar os dados da carteira."
              )
            }
          </p>

          <p>
            Verifique o número informado.
          </p>

        </div>

      `;

    }


    /* =====================================================
       INICIALIZAÇÃO
       ===================================================== */

    async function iniciar() {

      try {

        const numero =
          obterNumeroMembro();


        const membro =
          await buscarMembro(
            numero
          );


        if (!membro) {

          throw new Error(
            "Não foi possível obter os dados do membro."
          );

        }


        if (
          membro.encontrado === false
        ) {

          throw new Error(
            "O membro nº " +
            numero +
            " não foi encontrado."
          );

        }


        construirCarteira(
          membro
        );

      }

      catch (erro) {

        console.error(
          "Erro ao carregar carteira:",
          erro
        );


        mostrarErro(
          erro.message
        );

      }

    }


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "./service-worker.js?v=5"
            )
            .catch(
              function(erro) {

                console.warn(
                  "Service Worker não registrado:",
                  erro
                );

              }
            );

        }
      );

    }


    /* =====================================================
       REDIMENSIONAMENTO
       ===================================================== */

    window.addEventListener(
      "resize",
      function() {

        ajustarNome();

        ajustarFoto();

      }
    );


    /* =====================================================
       INICIAR
       ===================================================== */

    iniciar();


  </script>
