<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Identidade Confraria
  </title>

  <link
    rel="manifest"
    href="./manifest.json?v=9"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"

  <meta

  >


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

}


body {

  background: #F5F1E8;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #123A2F;

  overflow-x: hidden;

}


/* =====================================================
   APP
   ===================================================== */

#app {

  width: 100%;
  min-height: 100dvh;
  min-height: 100vh;

  display: flex;

  align-items: flex-start;
  justify-content: center;

  padding: 30px 15px;

}


/* =====================================================
   CARTEIRA
   ===================================================== */

.area-carteira {

  width: calc(760px * var(--card-scale, 1));
  height: calc(479px * var(--card-scale, 1));

  margin: 0 auto;
  position: relative;

}


.carteira {

  width: 760px;
  height: 479px;

  position: relative;
  perspective: 1200px;

  transform: scale(var(--card-scale, 1));
  transform-origin: top left;

}


.cartao {

  width: 100%;
  height: 100%;

  position: relative;

}


.face {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  background: #F5F1E8;

  border:
    1px solid #D9D0BF;

  border-radius: 18px;

  box-shadow:
    0 12px 30px rgba(0,0,0,0.12);

  overflow: hidden;

  backface-visibility: hidden;

}


/* =====================================================
   FRENTE
   ===================================================== */

.frente {

  display: flex;

  flex-direction: column;

}


/* =====================================================
   CABEÇALHO
   ===================================================== */

.cabecalho {

  position: relative;

  z-index: 2;

  padding:
    18px 25px 13px;

  text-align: center;

  border-bottom:
    1px solid #D9D0BF;

}


.titulo {

  font-size: 19px;

  font-weight: 700;

  letter-spacing: 1.15px;

  color: #123A2F;

  white-space: nowrap;

}


.subtitulo {

  margin-top: 6px;

  font-size: 10px;

  letter-spacing: 1.3px;

  color: #B58A2C;

}


/* =====================================================
   CORPO
   ===================================================== */

.corpo {

  position: relative;

  z-index: 2;

  flex: 1;

  display: grid;

  grid-template-columns:
    31% 41% 28%;

  align-items: center;

  padding:
    18px 25px 25px;

  overflow: hidden;


  background:

    linear-gradient(
      146deg,
      transparent 0%,
      transparent 47%,
      #B58A2C 47%,
      #B58A2C 52%,
      transparent 52%
    )
    top left / 145px 105px no-repeat,


    linear-gradient(
      326deg,
      transparent 0%,
      transparent 47%,
      #B58A2C 47%,
      #B58A2C 52%,
      transparent 52%
    )
    bottom right / 145px 105px no-repeat;

}


.corpo::before,
.corpo::after {

  content: "";

  position: absolute;

  width: 145px;
  height: 105px;

  pointer-events: none;

  z-index: 0;

}


.corpo::before {

  top: 0;
  left: 0;

  background: #123A2F;

  clip-path:
    polygon(
      0 0,
      100% 0,
      0 100%
    );

}


.corpo::after {

  right: 0;
  bottom: 0;

  background: #123A2F;

  clip-path:
    polygon(
      100% 100%,
      0 100%,
      100% 0
    );

}


.coluna-foto,
.coluna-central,
.coluna-direita {

  position: relative;

  z-index: 1;

}


/* =====================================================
   FOTO
   ===================================================== */

.coluna-foto {

  display: flex;

  align-items: center;
  justify-content: center;

  min-width: 0;

  transform:
    translateX(18px);

}


.foto {

  width: 180px;
  height: 205px;

  object-fit: cover;

  object-position: center center;

  border-radius: 11px;

  border:
    2px solid #B58A2C;

  display: block;

  max-width: 100%;

  box-shadow:
    0 6px 16px rgba(0,0,0,0.16);

}


.foto.vertical {

  object-position:
    center 20%;

}


.foto.vertical-extrema {

  object-position:
    center 15%;

}


.foto.horizontal {

  object-position:
    center center;

}


.foto.quadrada {

  object-position:
    center center;

}


.sem-foto {

  width: 180px;
  height: 205px;

  border:
    2px solid #B58A2C;

  border-radius: 11px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: #8A8377;

  font-size: 13px;

  max-width: 100%;

  background: #EFE8DA;

}


/* =====================================================
   COLUNA CENTRAL
   ===================================================== */

.coluna-central {

  text-align: center;

  padding:
    0 18px;

  transform:
    translateY(-2px);

  min-width: 0;

  overflow: hidden;

}


.nome {

  font-size: 29px;

  font-weight: 700;

  color: #123A2F;

  letter-spacing:
    0.25px;

  line-height:
    1.12;

  width: 100%;

  max-width: 100%;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: clip;

  margin: 0 auto;

}


.cargo {

  margin-top: 8px;

  font-size: 18px;

  color: #333333;

  line-height: 1.2;

}


.numero {

  margin-top: 10px;

  font-size: 14px;

  color: #806C51;

}


.status {

  display: inline-block;

  margin-top: 15px;

  padding:
    7px 20px;

  border-radius: 20px;

  background: #DCEEE6;

  color: #12614D;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 0.6px;

}


.lema {

  margin-top: 15px;

  font-size: 10px;

  letter-spacing: 1.05px;

  color: #B58A2C;

}


/* =====================================================
   ESPAÇO DA LOGO
   ===================================================== */

.logo-frente {

  display: block;

  width: auto;
  height: auto;

  max-width: 145px;
  max-height: 68px;

  object-fit: contain;

  margin:
    17px auto 0;

}


/* =====================================================
   COLUNA DIREITA
   ===================================================== */

.coluna-direita {

  border-left:
    1px solid #D9D0BF;

  padding-left: 22px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  min-width: 0;

}


.dados {

  width: 100%;

}


.linha {

  display: flex;

  justify-content: space-between;

  align-items: center;

  min-height: 37px;

  border-bottom:
    1px solid #E3DDD2;

  font-size: 12px;

  gap: 10px;

}


.rotulo {

  color: #806C51;

  white-space: nowrap;

}


.valor {

  color: #123A2F;

  font-weight: 600;

  text-align: right;

  white-space: nowrap;

}


/* =====================================================
   QR
   ===================================================== */

.qr-area {

  margin-top: 18px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

}


.qr {

  width: 90px;
  height: 90px;

  object-fit: contain;

  border:
    1px solid #D9D0BF;

  border-radius: 3px;

  background: #FFFFFF;

  padding: 2px;

  display: block;

}


.qr-texto {

  margin-top: 3px;

  font-size: 7px;

  letter-spacing: 0.45px;

  color: #6F685D;

  white-space: nowrap;

}


/* =====================================================
   VERSO
   ===================================================== */

.verso {

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

  background: #F5F1E8;

}


.verso::before,
.verso::after {

  content: "";

  position: absolute;

  pointer-events: none;

}


.verso::before {

  top: -115px;
  left: -90px;

  width: 260px;
  height: 225px;

  background: #123A2F;

  transform:
    rotate(-34deg);

  box-shadow:
    24px 16px 0 #B58A2C;

}


.verso::after {

  right: -95px;
  bottom: -110px;

  width: 260px;
  height: 225px;

  background: #123A2F;

  transform:
    rotate(-34deg);

  box-shadow:
    -24px -16px 0 #B58A2C;

}


.logo-verso {

  position: relative;

  z-index: 2;

  display: block;

  width: auto;
  height: auto;

  max-width: 320px;
  max-height: 180px;

  object-fit: contain;

}


.lema-verso {

  position: relative;

  z-index: 2;

  margin-top: 18px;

  color: #B58A2C;

  font-size: 13px;

  letter-spacing: 2px;

}


/* =====================================================
   BOTÃO
   ===================================================== */

.botao {

  display: block;

  position: absolute;
  left: 50%;
  top: calc(479px * var(--card-scale, 1) + 10px);
  transform: translateX(-50%);

  margin: 0;

  padding:
    8px 18px;

  border:
    1px solid #B58A2C;

  border-radius: 20px;

  background: transparent;

  color: #806C51;

  font-size: 11px;

  cursor: pointer;

}


.botao:hover {

  background:
    #EFE8DA;

}


/* =====================================================
   CARREGANDO
   ===================================================== */

#loading {

  width: 100%;

  max-width: 430px;

  margin:
    60px auto;

  padding:
    35px 25px;

  background:
    #F5F1E8;

  border:
    1px solid #D9D0BF;

  border-radius:
    18px;

  text-align:
    center;

  color:
    #123A2F;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,0.10);

}


/* =====================================================
   ERRO
   ===================================================== */

.erro {

  width: 100%;

  max-width: 430px;

  margin:
    60px auto;

  padding:
    35px 25px;

  background:
    #F5F1E8;

  border:
    1px solid #D9D0BF;

  border-radius:
    18px;

  text-align:
    center;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,0.10);

}


.erro h2 {

  margin:
    0 0 12px;

  color:
    #123A2F;

  font-size:
    21px;

}


.erro p {

  color:
    #666666;

  font-size:
    14px;

  line-height:
    1.5;

}


/* =====================================================
   CELULAR
   ===================================================== */




/* =====================================================
   ORIENTAÇÃO / BOTÃO HORIZONTAL
   ===================================================== */

.botao-horizontal {
  display: none;
  position: absolute;
  left: 50%;
  top: calc(479px * var(--card-scale, 1) + 58px);
  transform: translateX(-50%);
  margin: 0;
  padding: 8px 18px;
  border: 1px solid #B58A2C;
  border-radius: 20px;
  background: transparent;
  color: #806C51;
  font-size: 11px;
  cursor: pointer;
}

@media (orientation: portrait) {
  .botao-horizontal {
    display: block;
  }
}

</style>

</head>


<body>


<div id="app">

  <div id="loading">
    Carregando carteira...
  </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbyBiHc666uXQ0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec";


/* =====================================================
   OBTÉM NÚMERO DO MEMBRO
   ===================================================== */

function obterNumeroMembro() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  let numero =
    params.get("membro");


  if (!numero) {

    numero =
      localStorage.getItem(
        "confraria_membro"
      );

  }


  if (!numero) {

    numero =
      "0001";

  }


  numero =
    String(numero)
      .trim()
      .padStart(4, "0");


  localStorage.setItem(
    "confraria_membro",
    numero
  );


  return numero;

}


/* =====================================================
   BUSCA DADOS
   ===================================================== */

async function buscarDadosMembro(numero) {

  const url =
    WEB_APP_URL +
    "?dados=" +
    encodeURIComponent(numero) +
    "&pwa=5";


  const resposta =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!resposta.ok) {

    throw new Error(
      "Não foi possível carregar os dados."
    );

  }


  const dados =
    await resposta.json();


  if (
    !dados ||
    !dados.encontrado
  ) {

    throw new Error(
      dados &&
      dados.mensagem
        ? dados.mensagem
        : "Carteira não encontrada."
    );

  }


  return dados;

}


/* =====================================================
   CRIA A CARTEIRA
   ===================================================== */

function criarCarteira(membro) {

  const app =
    document.getElementById(
      "app"
    );


  app.innerHTML = "";


  const area =
    document.createElement(
      "div"
    );

  area.className =
    "area-carteira";


  area.innerHTML = `

    <div class="carteira">

      <div class="cartao">


        <!-- =========================================
             FRENTE
             ========================================= -->

        <div
          class="face frente"
          id="frente"
        >


          <div class="cabecalho">

            <div class="titulo">
              CARTEIRA DE IDENTIFICAÇÃO DA CONFRARIA
            </div>

            <div class="subtitulo">
              CONFRARIA COMPANHIA DA CACHAÇA
            </div>

          </div>


          <div class="corpo">


            <!-- FOTO -->

            <div class="coluna-foto">

              ${
                membro.foto

                  ? `

                    <img
                      class="foto"
                      id="fotoMembro"
                      src="${membro.foto}"
                      alt="Foto do associado"
                    >

                  `

                  : `

                    <div class="sem-foto">
                      FOTO
                    </div>

                  `
              }

            </div>


            <!-- CENTRAL -->

            <div class="coluna-central">


              <div
                class="nome"
                id="nomeConfrade"
              >
                ${escapeHtml(
                  membro.nome || ""
                )}
              </div>


              ${
                membro.cargo

                  ? `

                    <div class="cargo">
                      ${escapeHtml(
                        membro.cargo
                      )}
                    </div>

                  `

                  : ""
              }


              <div class="numero">

                ${escapeHtml(
                  membro.categoria || ""
                )}

                nº

                ${escapeHtml(
                  membro.numero || ""
                )}

              </div>


              ${
                membro.status

                  ? `

                    <div class="status">

                      ${escapeHtml(
                        membro.status
                      )}

                    </div>

                  `

                  : ""
              }


              <div class="lema">
                HONRA • TRADIÇÃO • PAIXÃO
              </div>


              <img
                class="logo-frente"
                src="./logo-confraria.png"
                alt="Confraria Companhia da Cachaça"
              >

            </div>


            <!-- DIREITA -->

            <div class="coluna-direita">


              <div class="dados">


                ${
                  membro.condicao

                    ? `

                      <div class="linha">

                        <span class="rotulo">
                          Condição
                        </span>

                        <span class="valor">
                          ${escapeHtml(
                            membro.condicao
                          )}
                        </span>

                      </div>

                    `

                    : ""
                }


                ${
                  membro.bienio

                    ? `

                      <div class="linha">

                        <span class="rotulo">
                          Biênio
                        </span>

                        <span class="valor">
                          ${escapeHtml(
                            membro.bienio
                          )}
                        </span>

                      </div>

                    `

                    : ""
                }


                ${
                  membro.ingresso

                    ? `

                      <div class="linha">

                        <span class="rotulo">
                          Ingresso
                        </span>

                        <span class="valor">
                          ${escapeHtml(
                            membro.ingresso
                          )}
                        </span>

                      </div>

                    `

                    : ""
                }


                ${
                  membro.validade

                    ? `

                      <div class="linha">

                        <span class="rotulo">
                          Validade
                        </span>

                        <span class="valor">
                          ${escapeHtml(
                            membro.validade
                          )}
                        </span>

                      </div>

                    `

                    : ""
                }


              </div>


              ${
                membro.qr

                  ? `

                    <div class="qr-area">

                      <img
                        class="qr"
                        src="${membro.qr}"
                        alt="QR Code de verificação"
                      >

                      <div class="qr-texto">
                        VERIFIQUE A AUTENTICIDADE
                      </div>

                    </div>

                  `

                  : ""
              }


            </div>


          </div>


        </div>


        <!-- =========================================
             VERSO
             ========================================= -->

        <div
          class="face verso"
          id="verso"
        >

          <img
            class="logo-verso"
            src="./logo-confraria.png"
            alt="Confraria Companhia da Cachaça"
          >

          <div
            class="lema-verso"
          >
            HONRA • TRADIÇÃO • PAIXÃO
          </div>

        </div>


      </div>

    </div>


    <button
      class="botao"
      id="botaoLado"
      type="button"
    >
      Ver verso
    </button>

  <button
    class="botao-horizontal"
    id="botaoHorizontal"
    type="button"
    onclick="abrirHorizontal()"
  >
    ↔ Abrir na horizontal
  </button>

  `;


  app.appendChild(
    area
  );

  agendarAjusteTamanho();


  const botao =
    document.getElementById(
      "botaoLado"
    );


  botao.addEventListener(
    "click",
    alternarLado
  );


  ajustarNome();

  ajustarFoto();

}


/* =====================================================
   ESCAPA HTML
   ===================================================== */

function escapeHtml(valor) {

  return String(
    valor || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   AJUSTE DA FOTO
   ===================================================== */

function ajustarFoto() {

  const foto =
    document.getElementById(
      "fotoMembro"
    );


  if (!foto) return;


  function analisarFoto() {

    const largura =
      foto.naturalWidth;


    const altura =
      foto.naturalHeight;


    if (
      !largura ||
      !altura
    ) {

      return;

    }


    const proporcao =
      largura / altura;


    foto.classList.remove(
      "vertical",
      "vertical-extrema",
      "horizontal",
      "quadrada"
    );


    if (
      proporcao < 0.62
    ) {

      foto.classList.add(
        "vertical-extrema"
      );

    }

    else if (
      proporcao < 0.90
    ) {

      foto.classList.add(
        "vertical"
      );

    }

    else if (
      proporcao > 1.15
    ) {

      foto.classList.add(
        "horizontal"
      );

    }

    else {

      foto.classList.add(
        "quadrada"
      );

    }

  }


  if (
    foto.complete
  ) {

    analisarFoto();

  }


  foto.addEventListener(
    "load",
    analisarFoto,
    {
      once: true
    }
  );

}


/* =====================================================
   AJUSTE DO NOME
   ===================================================== */

function ajustarNome() {

  const nome =
    document.getElementById(
      "nomeConfrade"
    );


  if (!nome) return;


  let tamanho =
    window.innerWidth <= 650
      ? 17
      : 29;


  nome.style.fontSize =
    tamanho + "px";


  nome.style.whiteSpace =
    "nowrap";


  while (

    nome.scrollWidth >
    nome.clientWidth &&

    tamanho >
    12

  ) {

    tamanho--;

    nome.style.fontSize =
      tamanho + "px";

  }


  if (
    nome.scrollWidth >
    nome.clientWidth
  ) {

    nome.style.whiteSpace =
      "normal";

    nome.style.overflow =
      "visible";

    nome.style.lineHeight =
      "1.08";

  }

}


/* =====================================================
   FRENTE / VERSO
   ===================================================== */

function alternarLado() {

  const frente =
    document.getElementById(
      "frente"
    );


  const verso =
    document.getElementById(
      "verso"
    );


  const botao =
    document.getElementById(
      "botaoLado"
    );


  if (
    frente.style.display !==
    "none"
  ) {

    frente.style.display =
      "none";


    verso.style.display =
      "flex";


    botao.textContent =
      "Ver frente";

  }

  else {

    frente.style.display =
      "flex";


    verso.style.display =
      "none";


    botao.textContent =
      "Ver verso";


    ajustarNome();

    ajustarFoto();

  }

}


/* =====================================================
   ERRO
   ===================================================== */

function mostrarErro(mensagem) {

  const app =
    document.getElementById(
      "app"
    );


  app.innerHTML = `

    <div class="erro">

      <h2>
        Carteira não encontrada
      </h2>

      <p>
        ${escapeHtml(
          mensagem ||
          "Não foi possível carregar a carteira."
        )}
      </p>

      <p>
        Verifique o número informado
        e tente novamente.
      </p>

    </div>

  `;

}


/* =====================================================
   TENTATIVA DE ABERTURA HORIZONTAL
   ===================================================== */

async function abrirNaHorizontal() {

  try {

    if (document.documentElement.requestFullscreen) {
      try {
        await document.documentElement.requestFullscreen();
      } catch (erroTelaCheia) {
        console.log("Tela cheia não disponível.");
      }
    }

    if (screen.orientation && screen.orientation.lock) {
      try {
        await screen.orientation.lock("landscape");
      } catch (erroOrientacao) {
        console.log("Bloqueio horizontal não disponível.");
      }
    }

    setTimeout(function() {
      ajustarTamanhoCarteira();
    }, 250);

  } catch (erro) {
    console.log("Orientação horizontal não disponível.");
  }

}

// Mantém compatibilidade caso alguma versão anterior use este nome.
function abrirHorizontal() {
  abrirNaHorizontal();
}


/* =====================================================
   CÁLCULO RESPONSIVO DA CARTEIRA
   ===================================================== */

function ajustarTamanhoCarteira() {

  const area = document.querySelector(".area-carteira");
  if (!area) return;

  const BASE_W = 760;
  const BASE_H = 479;

  // Usa a área visual real disponível. No Chrome Android,
  // innerHeight/visualViewport podem mudar alguns instantes
  // depois da abertura por causa da barra de endereço.
  const vv = window.visualViewport;
  const larguraTela = vv ? vv.width : window.innerWidth;
  const alturaTela = vv ? vv.height : window.innerHeight;

  // Margens laterais e superior/inferior. Reservamos espaço real
  // para os botões abaixo da carteira.
  const margemHorizontal = 24;
  const margemVertical = 24;

  // No modo horizontal o botão de orientação fica oculto,
  // portanto não precisamos reservar espaço para ele. Isso
  // permite aproveitar melhor a altura disponível da tela.
  const emRetrato = alturaTela >= larguraTela;
  const espacoBotoes = emRetrato ? 76 : 18;

  const larguraDisponivel = Math.max(280, larguraTela - margemHorizontal);
  const alturaDisponivel = Math.max(260, alturaTela - margemVertical - espacoBotoes);

  const escalaPorLargura = larguraDisponivel / BASE_W;
  const escalaPorAltura = alturaDisponivel / BASE_H;

  const escala = Math.min(escalaPorLargura, escalaPorAltura);

  area.style.setProperty("--card-scale", escala.toFixed(4));

}


function agendarAjusteTamanho() {

  // Faz várias leituras porque o Chrome Android pode alterar a
  // viewport depois de esconder/mostrar a barra de endereço.
  ajustarTamanhoCarteira();

  requestAnimationFrame(function() {
    ajustarTamanhoCarteira();

    requestAnimationFrame(function() {
      ajustarTamanhoCarteira();
    });
  });

  setTimeout(ajustarTamanhoCarteira, 100);
  setTimeout(ajustarTamanhoCarteira, 300);
  setTimeout(ajustarTamanhoCarteira, 600);

}


/* =====================================================
   CARREGAMENTO PRINCIPAL
   ===================================================== */

async function carregarCarteira() {

  try {

    const numero =
      obterNumeroMembro();


    const membro =
      await buscarDadosMembro(
        numero
      );


    criarCarteira(
      membro
    );


  }

  catch (erro) {

    console.error(
      erro
    );


    mostrarErro(
      erro.message
    );

  }

}


/* =====================================================
   SERVICE WORKER
   ===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "./service-worker.js?v=9"
        )

        .catch(
          function(erro) {

            console.log(
              "Service Worker:",
              erro
            );

          }
        );

    }
  );

}


/* =====================================================
   REDIMENSIONAMENTO
   ===================================================== */

window.addEventListener(
  "resize",
  function() {

    agendarAjusteTamanho();
    ajustarNome();
    ajustarFoto();

  }
);

if (window.visualViewport) {
  window.visualViewport.addEventListener(
    "resize",
    function() {
      agendarAjusteTamanho();
    }
  );
}

window.addEventListener(
  "orientationchange",
  function() {
    setTimeout(function() {
      agendarAjusteTamanho();
      ajustarNome();
      ajustarFoto();
    }, 120);
  }
);


/* =====================================================
   INICIA
   ===================================================== */

carregarCarteira();

</script>
