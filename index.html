<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Identidade Confraria</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111111">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111111;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #111111;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111111;
      color: #F5F1E8;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    #erro {
      display: none;

      position: fixed;
      inset: 0;
      z-index: 20;

      align-items: center;
      justify-content: center;

      padding: 25px;

      background: #111111;
      color: #F5F1E8;

      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .erro-box {
      max-width: 420px;

      padding: 30px;

      border-radius: 16px;

      background: #F5F1E8;
      color: #123A2F;

      box-shadow: 0 15px 40px rgba(0,0,0,.30);
    }

    .erro-box h2 {
      margin: 0 0 12px;
    }

    .erro-box p {
      margin: 6px 0;
      color: #6B4A2B;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="loading">
    Carregando carteira...
  </div>

  <iframe
    id="carteira"
    title="Carteira de Identificação da Confraria"
    allow="clipboard-write"
    referrerpolicy="no-referrer"
    style="display:none;">
  </iframe>

  <div id="erro">
    <div class="erro-box">
      <h2>Carteira não carregada</h2>
      <p>
        Não foi possível carregar a carteira da Confraria.
      </p>
      <p>
        Tente atualizar a página.
      </p>
    </div>
  </div>


  <script>

    const WEB_APP =
      "https://script.google.com/macros/s/AKfycbyBiHc666uX0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec";


    function obterMembro() {

      const parametros =
        new URLSearchParams(window.location.search);

      let membro =
        parametros.get("membro");

      if (!membro) {

        membro =
          localStorage.getItem(
            "confraria_membro"
          );

      }

      if (!membro) {

        membro = "0001";

      }

      membro =
        String(membro).padStart(4, "0");

      localStorage.setItem(
        "confraria_membro",
        membro
      );

      return membro;

    }


    function carregar() {

      const membro =
        obterMembro();


      const iframe =
        document.getElementById(
          "carteira"
        );

      const loading =
        document.getElementById(
          "loading"
        );


      const url =
        WEB_APP +
        "?membro=" +
        encodeURIComponent(membro) +
        "&pwa=3c";


      iframe.src = url;


      iframe.onload = function() {

        loading.style.display =
          "none";

        iframe.style.display =
          "block";

      };


      /*
       * O iframe pode carregar através de
       * redirecionamentos do Google.
       *
       * Não usamos API JSONP.
       * Não usamos callback.
       * Não usamos api=1.
       */

      setTimeout(function() {

        loading.style.display =
          "none";

        iframe.style.display =
          "block";

      }, 5000);

    }


    /*
     * Service Worker
     */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "./service-worker.js"
            )
            .catch(function(erro) {

              console.log(
                "Service Worker:",
                erro
              );

            });

        }
      );

    }


    carregar();

  </script>

</body>
</html>
