<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identidade Confraria</title>

  <link rel="manifest" href="./manifest.json?v=7">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Identidade Confraria">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      background: #111111;
    }

    #walletFrame {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: 0;
      display: block;
      background: #111111;
    }

    #loading,
    #error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #F5F1E8;
      background: #111111;
      z-index: 10;
    }

    #error {
      display: none;
    }

    .box {
      max-width: 440px;
      padding: 28px;
      border-radius: 16px;
      background: #F5F1E8;
      color: #123A2F;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .box h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .box p {
      margin: 7px 0;
      color: #6B4A2B;
      font-size: 13px;
      line-height: 1.5;
    }

    .box button {
      margin-top: 12px;
      border: 1px solid #B58A2C;
      border-radius: 30px;
      padding: 9px 20px;
      background: #B58A2C;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main id="app">

    <div id="loading">
      Carregando carteira...
    </div>

    <iframe
      id="walletFrame"
      title="Carteira de Identificação da Confraria"
      allow="clipboard-write"
      referrerpolicy="no-referrer"
      style="display:none;">
    </iframe>

    <div id="error">
      <div class="box">
        <h2>Carteira não encontrada</h2>

        <p>
          Não foi possível carregar a carteira da Confraria.
        </p>

        <p>
          Verifique o número informado e tente novamente.
        </p>

        <button
          type="button"
          onclick="window.location.reload()">
          Tentar novamente
        </button>
      </div>
    </div>

  </main>

<script>

  /*
   * =========================================================
   * IDENTIDADE CONFRARIA
   * =========================================================
   *
   * O PWA permanece hospedado no GitHub Pages.
   *
   * A carteira é carregada diretamente pelo Web App
   * do Google Apps Script.
   *
   * ESTE É O ENDEREÇO COMPROVADAMENTE FUNCIONAL.
   *
   * =========================================================
   */

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbyBiHc666uXQ0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec";


  /*
   * =========================================================
   * NÚMERO DO MEMBRO
   * =========================================================
   */

  function obterNumeroMembro() {

    const params =
      new URLSearchParams(window.location.search);

    let numero =
      params.get("membro");


    if (!numero) {

      numero =
        localStorage.getItem(
          "confraria_membro"
        );

    }


    if (!numero) {

      numero = "0001";

    }


    numero =
      String(numero).padStart(4, "0");


    localStorage.setItem(
      "confraria_membro",
      numero
    );


    return numero;

  }


  /*
   * =========================================================
   * CARREGAR CARTEIRA
   * =========================================================
   */

  function carregarCarteira() {

    const numero =
      obterNumeroMembro();


    const iframe =
      document.getElementById(
        "walletFrame"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const error =
      document.getElementById(
        "error"
      );


    /*
     * Usa EXATAMENTE a rota que está funcionando.
     */

    const url =
      WEB_APP_URL +
      "?membro=" +
      encodeURIComponent(numero) +
      "&pwa=3c";


    let carregou = false;


    iframe.onload = function() {

      carregou = true;

      loading.style.display =
        "none";

      error.style.display =
        "none";

      iframe.style.display =
        "block";

    };


    iframe.onerror = function() {

      loading.style.display =
        "none";

      iframe.style.display =
        "none";

      error.style.display =
        "flex";

    };


    iframe.src = url;


    /*
     * Se o navegador não disparar o
     * onload, ainda mantém o iframe visível.
     */

    setTimeout(function() {

      if (!carregou) {

        loading.style.display =
          "none";

        iframe.style.display =
          "block";

      }

    }, 12000);

  }


  /*
   * =========================================================
   * SERVICE WORKER
   * =========================================================
   */

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker
          .register(
            "./service-worker.js?v=7"
          )
          .catch(function(error) {

            console.log(
              "Service Worker:",
              error
            );

          });

      }
    );

  }


  /*
   * =========================================================
   * INICIAR
   * =========================================================
   */

  carregarCarteira();

</script>

</body>
</html>
