<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#123A2F">
  <meta name="description" content="Carteira Digital da Confraria Companhia da Cachaça">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Confraria">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Confraria</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #F5F1E8;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F1E8;
    }

    #carteira {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #F5F1E8;
    }

    #mensagem {
      max-width: 420px;
      margin: 24px;
      padding: 28px;
      text-align: center;
      border: 1px solid #D9D0BF;
      border-radius: 18px;
      background: #F5F1E8;
      color: #123A2F;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 10px 25px rgba(0,0,0,.10);
    }

    #mensagem h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    #mensagem p {
      margin: 0;
      color: #6F685D;
      line-height: 1.5;
      font-size: 14px;
    }

    @media (orientation: portrait) {
      #app::before {
        content: "Gire o celular para usar a carteira na horizontal.";
        position: absolute;
        z-index: 10;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(86vw, 360px);
        padding: 20px;
        text-align: center;
        border-radius: 16px;
        background: #123A2F;
        color: #F5F1E8;
        font: 600 15px/1.4 Arial, Helvetica, sans-serif;
        box-shadow: 0 10px 30px rgba(0,0,0,.25);
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="mensagem">
      <h1>Confraria Companhia da Cachaça</h1>
      <p>Carregando sua carteira digital...</p>
    </div>
  </main>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyBiHc666uX0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec";
    const STORAGE_KEY = "confraria_membro";

    function numeroValido(numero) {
      return /^\d{4}$/.test(numero || "");
    }

    function obterNumeroMembro() {
      const params = new URLSearchParams(window.location.search);
      const daUrl = params.get("membro");

      if (numeroValido(daUrl)) {
        localStorage.setItem(STORAGE_KEY, daUrl);
        return daUrl;
      }

      const salvo = localStorage.getItem(STORAGE_KEY);

      if (numeroValido(salvo)) {
        return salvo;
      }

      return "";
    }

    function mostrarMensagem(titulo, texto) {
      const app = document.getElementById("app");

      app.innerHTML = `
        <div id="mensagem">
          <h1>${titulo}</h1>
          <p>${texto}</p>
        </div>
      `;
    }

    function abrirCarteira() {
      const membro = obterNumeroMembro();
      const app = document.getElementById("app");

      if (!membro) {
        mostrarMensagem(
          "Carteira Digital",
          "Acesse primeiro o link individual da sua carteira para vincular seu número a este aplicativo."
        );
        return;
      }

      const iframe = document.createElement("iframe");
      iframe.id = "carteira";
      iframe.title = "Carteira Digital da Confraria Companhia da Cachaça";
      iframe.allow = "fullscreen";
      iframe.setAttribute("loading", "eager");
      iframe.src = APP_URL + "?membro=" + encodeURIComponent(membro);

      iframe.addEventListener("load", () => {
        document.title = "Confraria";
      });

      app.innerHTML = "";
      app.appendChild(iframe);
    }

    function registrarServiceWorker() {
      if (!("serviceWorker" in navigator)) {
        return;
      }

      navigator.serviceWorker.register("./service-worker.js", {
        scope: "./"
      }).catch(err => {
        console.warn("Service Worker:", err);
      });
    }

    window.addEventListener("load", () => {
      registrarServiceWorker();
      abrirCarteira();
    });
  </script>
</body>
</html>
