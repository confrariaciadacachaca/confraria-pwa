<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#123A2F">
  <meta name="description" content="Carteira Digital da Confraria Companhia da Cachaça">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <title>Confraria</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #F5F1E8;
    }

    #app {
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F1E8;
    }

    #carteira {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #F5F1E8;
    }

    #mensagem {
      max-width: 420px;
      margin: 24px;
      padding: 28px;
      text-align: center;
      border: 1px solid #D9D0BF;
      border-radius: 18px;
      background: #F5F1E8;
      color: #123A2F;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 10px 25px rgba(0,0,0,.10);
    }

    #mensagem h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    #mensagem p {
      margin: 0;
      color: #6F685D;
      line-height: 1.5;
      font-size: 14px;
    }

    @media (orientation: portrait) {
      #app::before {
        content: "Gire o celular para usar a carteira na horizontal.";
        position: absolute;
        z-index: 10;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(86vw, 360px);
        padding: 20px;
        text-align: center;
        border-radius: 16px;
        background: #123A2F;
        color: #F5F1E8;
        font: 600 15px/1.4 Arial, Helvetica, sans-serif;
        box-shadow: 0 10px 30px rgba(0,0,0,.25);
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="mensagem">
      <h1>Confraria Companhia da Cachaça</h1>
      <p>Carregando sua carteira digital...</p>
    </div>
  </main>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyBiHc666uXQ0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec";

    function obterNumeroMembro() {
      const params = new URLSearchParams(window.location.search);
      const daUrl = params.get("membro");

      if (daUrl && /^\d{4}$/.test(daUrl)) {
        localStorage.setItem("confraria_membro", daUrl);
        return daUrl;
      }

      const salvo = localStorage.getItem("confraria_membro");

      if (salvo && /^\d{4}$/.test(salvo)) {
        return salvo;
      }

      return "";
    }

    function abrirCarteira() {
      const membro = obterNumeroMembro();
      const app = document.getElementById("app");

      if (!membro) {
        app.innerHTML = `
          <div id="mensagem">
            <h1>Carteira Digital</h1>
            <p>
              Acesse o link individual da sua carteira para
              instalar este aplicativo no celular.
            </p>
          </div>
        `;
        return;
      }

      const iframe = document.createElement("iframe");
      iframe.id = "carteira";
      iframe.allow = "fullscreen";
      iframe.src = APP_URL + "?membro=" + encodeURIComponent(membro);

      app.innerHTML = "";
      app.appendChild(iframe);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(err => console.warn("Service Worker:", err));
      });
    }

    abrirCarteira();
  </script>
</body>
</html>
