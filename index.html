<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Identidade Confraria"
  >

  <title>Identidade Confraria</title>

  <link
    rel="manifest"
    href="./manifest.json?v=4"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100%;

      background: #111111;

      color: #111111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    body {

      min-height: 100vh;

      overflow-x: hidden;

    }


    #app {

      width: 100%;

      min-height: 100vh;

    }


    /* ==================================================
       TELA DE CARREGAMENTO
       ================================================== */

    .loading-screen {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background: #111111;

      color: #ffffff;

      padding: 30px;

      text-align: center;

    }


    .loading-logo {

      width: 110px;

      height: 110px;

      object-fit: contain;

      margin-bottom: 24px;

      border-radius: 18px;

    }


    .loading-title {

      font-size: 19px;

      font-weight: 700;

      letter-spacing: 0.5px;

      margin-bottom: 8px;

    }


    .loading-text {

      font-size: 13px;

      opacity: 0.72;

    }


    .spinner {

      width: 28px;

      height: 28px;

      margin-top: 22px;

      border: 3px solid rgba(
        255,
        255,
        255,
        0.25
      );

      border-top-color: #B58A2C;

      border-radius: 50%;

      animation:
        girar 0.8s linear infinite;

    }


    @keyframes girar {

      to {
        transform: rotate(360deg);
      }

    }


    /* ==================================================
       ERRO / MEMBRO NÃO ENCONTRADO
       ================================================== */

    .error-screen {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      background: #111111;

    }


    .error-card {

      width: 100%;

      max-width: 420px;

      background: #F5F1E8;

      border-radius: 20px;

      padding: 30px 24px;

      text-align: center;

      box-shadow:
        0 18px 50px rgba(
          0,
          0,
          0,
          0.35
        );

    }


    .error-card h1 {

      margin: 0 0 12px;

      color: #123A2F;

      font-size: 21px;

    }


    .error-card p {

      margin: 0;

      color: #555555;

      font-size: 14px;

      line-height: 1.5;

    }


    /* ==================================================
       ÁREA DA CARTEIRA
       ================================================== */

    .wallet-app {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        22px
        14px
        34px;

      background:
        radial-gradient(
          circle at top,
          #2b2b2b 0%,
          #111111 52%,
          #080808 100%
        );

    }


    .wallet-stage {

      width: 100%;

      max-width: 940px;

    }


    /* ==================================================
       CARD
       ================================================== */

    .card-container {

      width: 100%;

      max-width: 920px;

      margin: 0 auto;

      perspective: 1400px;

    }


    .card {

      position: relative;

      width: 100%;

      aspect-ratio: 1.586 / 1;

      transform-style: preserve-3d;

      transition:
        transform 0.65s
        cubic-bezier(
          0.22,
          0.61,
          0.36,
          1
        );

    }


    .card.virado {

      transform:
        rotateY(180deg);

    }


    .card-face {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border-radius: 22px;

      overflow: hidden;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;

      box-shadow:
        0 22px 60px rgba(
          0,
          0,
          0,
          0.48
        );

      border: 1px solid rgba(
        181,
        138,
        44,
        0.32
      );

    }


    .card-front {

      background: #F5F1E8;

      transform:
        rotateY(0deg);

    }


    .card-back {

      background: #F5F1E8;

      transform:
        rotateY(180deg);

    }


    /* ==================================================
       FAIXAS DECORATIVAS
       ================================================== */

    .corner {

      position: absolute;

      z-index: 1;

      background: #123A2F;

    }


    .corner-top {

      top: 0;

      right: 0;

      width: 29%;

      height: 12%;

      clip-path:
        polygon(
          25% 0,
          100% 0,
          100% 100%,
          0 100%
        );

    }


    .corner-bottom {

      bottom: 0;

      left: 0;

      width: 27%;

      height: 11%;

      clip-path:
        polygon(
          0 0,
          100% 0,
          72% 100%,
          0 100%
        );

    }


    .gold-line {

      position: absolute;

      z-index: 2;

      background: #B58A2C;

      opacity: 0.85;

    }


    .gold-line-top {

      top: 12%;

      right: 0;

      width: 29%;

      height: 2px;

    }


    .gold-line-bottom {

      bottom: 11%;

      left: 0;

      width: 27%;

      height: 2px;

    }


    /* ==================================================
       FRENTE
       ================================================== */

    .front-content {

      position: relative;

      z-index: 5;

      width: 100%;

      height: 100%;

      display: grid;

      grid-template-columns:
        25%
        47%
        28%;

      padding: 7% 5% 6%;

    }


    .photo-column {

      display: flex;

      align-items: center;

      justify-content: center;

      padding-right: 7%;

      min-width: 0;

    }


    .photo-frame {

      width: 100%;

      max-width: 170px;

      aspect-ratio: 1 / 1.16;

      border-radius: 13px;

      overflow: hidden;

      background: #ded8ca;

      border: 4px solid #ffffff;

      box-shadow:
        0 7px 18px rgba(
          0,
          0,
          0,
          0.18
        );

    }


    .photo-frame img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

    }


    .photo-placeholder {

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #777777;

      font-size: 12px;

      text-align: center;

      padding: 10px;

    }


    .main-column {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-width: 0;

      padding:
        0 4%;

    }


    .card-title {

      width: 100%;

      text-align: center;

      white-space: nowrap;

      font-size:
        clamp(
          10px,
          1.65vw,
          17px
        );

      font-weight: 800;

      letter-spacing:
        clamp(
          0.3px,
          0.12vw,
          1.1px
        );

      color: #123A2F;

      margin-bottom: 6%;

    }


    .member-name {

      width: 100%;

      text-align: center;

      color: #111111;

      font-size:
        clamp(
          18px,
          3vw,
          31px
        );

      font-weight: 800;

      line-height: 1.05;

      margin-bottom: 3%;

      overflow-wrap: anywhere;

    }


    .member-number {

      color: #B58A2C;

      font-size:
        clamp(
          10px,
          1.2vw,
          13px
        );

      font-weight: 700;

      letter-spacing: 1px;

      margin-bottom: 6%;

    }


    .data-list {

      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        5px 10px;

    }


    .data-item {

      min-width: 0;

      padding-bottom: 4px;

    }


    .data-label {

      display: block;

      color: #777777;

      font-size:
        clamp(
          7px,
          0.9vw,
          10px
        );

      text-transform: uppercase;

      letter-spacing: 0.45px;

      margin-bottom: 2px;

    }


    .data-value {

      display: block;

      color: #123A2F;

      font-size:
        clamp(
          9px,
          1.15vw,
          13px
        );

      font-weight: 700;

      overflow-wrap: anywhere;

    }


    .qr-column {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-width: 0;

      padding-left: 5%;

    }


    .qr-box {

      width:
        min(
          76%,
          185px
        );

      aspect-ratio: 1 / 1;

      background: #ffffff;

      border-radius: 10px;

      padding: 8px;

      box-shadow:
        0 5px 16px rgba(
          0,
          0,
          0,
          0.12
        );

    }


    .qr-box img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: contain;

    }


    .qr-caption {

      margin-top: 8px;

      width: 100%;

      text-align: center;

      font-size:
        clamp(
          7px,
          0.8vw,
          9px
        );

      font-weight: 700;

      letter-spacing: 0.45px;

      color: #123A2F;

      line-height: 1.25;

    }


    /* ==================================================
       LOGO DA FRENTE
       ================================================== */

    .front-logo {

      position: absolute;

      z-index: 6;

      bottom: 7%;

      left: 50%;

      transform:
        translateX(-50%);

      width:
        clamp(
          65px,
          9vw,
          105px
        );

      max-height: 17%;

      object-fit: contain;

      object-position: center;

    }


    /* ==================================================
       VERSO
       ================================================== */

    .back-content {

      position: relative;

      z-index: 5;

      width: 100%;

      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 8% 10%;

    }


    .back-logo {

      width:
        clamp(
          130px,
          24vw,
          245px
        );

      max-width: 45%;

      max-height: 50%;

      object-fit: contain;

      margin-bottom: 5%;

    }


    .back-motto {

      color: #123A2F;

      font-size:
        clamp(
          11px,
          1.5vw,
          16px
        );

      font-weight: 700;

      letter-spacing: 1.2px;

      text-align: center;

      text-transform: uppercase;

    }


    .back-small {

      margin-top: 10px;

      color: #6B4A2B;

      font-size:
        clamp(
          8px,
          1vw,
          11px
        );

      text-align: center;

      letter-spacing: 0.5px;

    }


    /* ==================================================
       BOTÕES
       ================================================== */

    .wallet-actions {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      margin-top: 18px;

      flex-wrap: wrap;

    }


    .action-button {

      border: 0;

      border-radius: 999px;

      padding:
        11px
        18px;

      background: #123A2F;

      color: #ffffff;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 5px 15px rgba(
          0,
          0,
          0,
          0.22
        );

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;

    }


    .action-button:active {

      transform:
        scale(0.97);

    }


    .action-button.secondary {

      background: #B58A2C;

    }


    .wallet-footer {

      margin-top: 18px;

      text-align: center;

      color: rgba(
        255,
        255,
        255,
        0.65
      );

      font-size: 10px;

      line-height: 1.4;

    }


    /* ==================================================
       ORIENTAÇÃO
       ================================================== */

    .portrait-warning {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 9999;

      background: #111111;

      color: #ffffff;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;

    }


    .portrait-warning-inner {

      max-width: 300px;

    }


    .portrait-warning-title {

      font-size: 20px;

      font-weight: 800;

      margin-bottom: 10px;

    }


    .portrait-warning-text {

      font-size: 13px;

      line-height: 1.5;

      opacity: 0.8;

    }


    /* ==================================================
       CELULAR
       ================================================== */

    @media (
      max-width: 700px
    ) {

      .wallet-app {

        padding:
          16px
          8px
          26px;

      }


      .card-container {

        max-width: 96vw;

      }


      .card {

        aspect-ratio: 1.52 / 1;

      }


      .front-content {

        grid-template-columns:
          23%
          50%
          27%;

        padding:
          8%
          4.5%
          6%;

      }


      .photo-column {

        padding-right: 5%;

      }


      .photo-frame {

        max-width: 100%;

        border-width: 3px;

      }


      .qr-column {

        padding-left: 3%;

      }


      .qr-box {

        width: 82%;

        padding: 5px;

      }


      .front-logo {

        bottom: 5%;

      }

    }


    @media (
      max-width: 430px
    ) {

      .wallet-app {

        padding-top: 10px;

      }


      .card {

        aspect-ratio: 1.46 / 1;

      }


      .card-face {

        border-radius: 15px;

      }


      .front-content {

        padding:
          7%
          3.5%
          5%;

      }


      .data-list {

        gap:
          2px
          5px;

      }


      .data-label {

        font-size: 6px;

      }


      .data-value {

        font-size: 8px;

      }


      .card-title {

        font-size: 8px;

      }


      .member-name {

        font-size: 15px;

      }


      .member-number {

        font-size: 8px;

      }


      .qr-caption {

        font-size: 6px;

      }


      .wallet-actions {

        margin-top: 12px;

      }


      .action-button {

        padding:
          9px
          14px;

        font-size: 11px;

      }

    }


    /* ==================================================
       ORIENTAÇÃO PAISAGEM
       ================================================== */

    @media (
      orientation: portrait
    ) and (
      max-width: 700px
    ) {

      .portrait-warning {

        display: flex;

      }

    }

  </style>

</head>


<body>

  <div id="app">

    <div class="loading-screen">

      <div class="loading-title">
        Identidade Confraria
      </div>

      <div class="loading-text">
        Carregando sua carteira digital...
      </div>

      <div class="spinner"></div>

    </div>

  </div>


  <div class="portrait-warning">

    <div class="portrait-warning-inner">

      <div class="portrait-warning-title">
        Vire o celular
      </div>

      <div class="portrait-warning-text">
        Para visualizar sua carteira digital,
        utilize o celular na posição horizontal.
      </div>

    </div>

  </div>


<script>

  // ====================================================
  // CONFIGURAÇÃO
  // ====================================================

  const APP_URL =
    'https://script.google.com/macros/s/AKfycbyBiHc666uXQ0npNWBHzyGGVQ79fFbtn93zKyCydZPRySbe7ie3_XpACkzO5zwe_4oO9Q/exec';


  const STORAGE_KEY =
    'confraria_membro';


  const VERSION =
    '4';


  // ====================================================
  // UTILITÁRIOS
  // ====================================================

  function escaparHTML(valor) {

    if (
      valor === undefined ||
      valor === null
    ) {
      return '';
    }

    return String(valor)
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  function obterNumeroMembro() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const numeroURL =
      params.get('membro');


    if (
      numeroURL &&
      /^\d{1,4}$/.test(
        numeroURL
      )
    ) {

      const numero =
        numeroURL.padStart(
          4,
          '0'
        );


      localStorage.setItem(
        STORAGE_KEY,
        numero
      );


      return numero;

    }


    const salvo =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (
      salvo &&
      /^\d{4}$/.test(
        salvo
      )
    ) {

      return salvo;

    }


    return '';

  }


  // ====================================================
  // CARREGAMENTO VIA JSONP
  // ====================================================

  function buscarMembro(numero) {

    return new Promise(
      function(resolve, reject) {

        const callbackName =
          'confrariaCallback_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 100000
          );


        const script =
          document.createElement(
            'script'
          );


        let finalizado = false;


        const timeout =
          setTimeout(
            function() {

              if (finalizado) return;

              finalizado = true;

              cleanup();

              reject(
                new Error(
                  'Tempo limite ao consultar a carteira.'
                )
              );

            },
            20000
          );


        function cleanup() {

          clearTimeout(
            timeout
          );

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

          try {

            delete window[
              callbackName
            ];

          } catch (erro) {

            window[
              callbackName
            ] = undefined;

          }

        }


        window[
          callbackName
        ] =
          function(dados) {

            if (finalizado) return;

            finalizado = true;

            cleanup();

            resolve(dados);

          };


        script.onerror =
          function() {

            if (finalizado) return;

            finalizado = true;

            cleanup();

            reject(
              new Error(
                'Não foi possível consultar o servidor da Confraria.'
              )
            );

          };


        const url =
          APP_URL +
          '?api=1' +
          '&membro=' +
          encodeURIComponent(
            numero
          ) +
          '&callback=' +
          encodeURIComponent(
            callbackName
          ) +
          '&pwa=' +
          VERSION;


        script.src =
          url;


        document
          .head
          .appendChild(
            script
          );

      }
    );

  }


  // ====================================================
  // FOTO
  // ====================================================

  function criarFotoHTML(foto) {

    if (!foto) {

      return `
        <div class="photo-frame">
          <div class="photo-placeholder">
            Foto não cadastrada
          </div>
        </div>
      `;

    }


    return `
      <div class="photo-frame">
        <img
          src="${foto}"
          alt="Foto do confrade"
        >
      </div>
    `;

  }


  // ====================================================
  // DADOS
  // ====================================================

  function campo(
    label,
    valor
  ) {

    if (
      valor === undefined ||
      valor === null ||
      String(valor).trim() === ''
    ) {

      return '';

    }


    return `
      <div class="data-item">

        <span class="data-label">
          ${escaparHTML(label)}
        </span>

        <span class="data-value">
          ${escaparHTML(valor)}
        </span>

      </div>
    `;

  }


  // ====================================================
  // CARTEIRA
  // ====================================================

  function renderizarCarteira(
    membro
  ) {

    const app =
      document.getElementById(
        'app'
      );


    const logo =
      membro.logo ||
      '';


    const foto =
      membro.foto ||
      '';


    const qr =
      membro.qr ||
      '';


    app.innerHTML = `

      <main class="wallet-app">

        <div class="wallet-stage">

          <div class="card-container">

            <div
              class="card"
              id="walletCard"
            >


              <!-- ==================================
                   FRENTE
                   ================================== -->

              <section
                class="card-face card-front"
              >

                <div class="corner corner-top"></div>

                <div class="corner corner-bottom"></div>

                <div class="gold-line gold-line-top"></div>

                <div class="gold-line gold-line-bottom"></div>


                <div class="front-content">


                  <div class="photo-column">

                    ${criarFotoHTML(foto)}

                  </div>


                  <div class="main-column">

                    <div class="card-title">
                      CARTEIRA DE IDENTIFICAÇÃO DA CONFRARIA
                    </div>


                    <div class="member-name">
                      ${escaparHTML(
                        membro.nome
                      )}
                    </div>


                    <div class="member-number">
                      Nº ${escaparHTML(
                        membro.numero
                      )}
                    </div>


                    <div class="data-list">

                      ${campo(
                        'Categoria',
                        membro.categoria
                      )}

                      ${campo(
                        'Condição',
                        membro.condicao
                      )}

                      ${campo(
                        'Cargo',
                        membro.cargo
                      )}

                      ${campo(
                        'Biênio',
                        membro.bienio
                      )}

                      ${campo(
                        'Ingresso',
                        membro.ingresso
                      )}

                      ${campo(
                        'Validade',
                        membro.validade
                      )}

                    </div>

                  </div>


                  <div class="qr-column">

                    ${
                      qr
                      ?
                      `
                        <div class="qr-box">

                          <img
                            src="${escaparHTML(qr)}"
                            alt="QR Code de verificação"
                          >

                        </div>

                        <div class="qr-caption">
                          VERIFIQUE A AUTENTICIDADE
                        </div>
                      `
                      :
                      ''
                    }

                  </div>


                </div>


                ${
                  logo
                  ?
                  `
                    <img
                      class="front-logo"
                      src="${logo}"
                      alt="Confraria Companhia da Cachaça"
                    >
                  `
                  :
                  ''
                }

              </section>


              <!-- ==================================
                   VERSO
                   ================================== -->

              <section
                class="card-face card-back"
              >

                <div class="corner corner-top"></div>

                <div class="corner corner-bottom"></div>

                <div class="gold-line gold-line-top"></div>

                <div class="gold-line gold-line-bottom"></div>


                <div class="back-content">

                  ${
                    logo
                    ?
                    `
                      <img
                        class="back-logo"
                        src="${logo}"
                        alt="Confraria Companhia da Cachaça"
                      >
                    `
                    :
                    ''
                  }


                  <div class="back-motto">
                    HONRA, TRADIÇÃO E PAIXÃO.
                  </div>


                  <div class="back-small">
                    Confraria Companhia da Cachaça
                  </div>

                </div>

              </section>


            </div>

          </div>


          <div class="wallet-actions">

            <button
              class="action-button"
              type="button"
              onclick="virarCarteira()"
              id="flipButton"
            >
              Ver verso
            </button>


            <button
              class="action-button secondary"
              type="button"
              onclick="compartilharCarteira()"
            >
              Compartilhar
            </button>

          </div>


          <div class="wallet-footer">

            Identidade Confraria<br>

            Confraria Companhia da Cachaça

          </div>

        </div>

      </main>

    `;

  }


  // ====================================================
  // FRENTE / VERSO
  // ====================================================

  function virarCarteira() {

    const card =
      document.getElementById(
        'walletCard'
      );


    const button =
      document.getElementById(
        'flipButton'
      );


    if (!card) return;


    card.classList.toggle(
      'virado'
    );


    if (
      card.classList.contains(
        'virado'
      )
    ) {

      button.textContent =
        'Ver frente';

    } else {

      button.textContent =
        'Ver verso';

    }

  }


  // ====================================================
  // COMPARTILHAR
  // ====================================================

  async function compartilharCarteira() {

    const url =
      window.location.href;


    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            'Identidade Confraria',

          text:
            'Carteira Digital — Confraria Companhia da Cachaça',

          url:
            url

        });

        return;

      } catch (erro) {

        // Cancelamento pelo usuário.
        // Não fazemos nada.

      }

    }


    try {

      await navigator.clipboard.writeText(
        url
      );


      alert(
        'Link da carteira copiado.'
      );

    } catch (erro) {

      prompt(
        'Copie o link da carteira:',
        url
      );

    }

  }


  // ====================================================
  // INICIALIZAÇÃO
  // ====================================================

  async function iniciar() {

    const numero =
      obterNumeroMembro();


    if (!numero) {

      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="error-screen">

          <div class="error-card">

            <h1>
              Identidade Confraria
            </h1>

            <p>
              Não foi possível identificar
              o número da carteira.
            </p>

          </div>

        </div>

      `;

      return;

    }


    try {

      const membro =
        await buscarMembro(
          numero
        );


      if (
        !membro ||
        !membro.encontrado
      ) {

        throw new Error(
          membro &&
          membro.mensagem
            ?
            membro.mensagem
            :
            'Carteira não encontrada.'
        );

      }


      renderizarCarteira(
        membro
      );


    } catch (erro) {

      console.error(
        erro
      );


      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="error-screen">

          <div class="error-card">

            <h1>
              Carteira não encontrada
            </h1>

            <p>
              ${
                escaparHTML(
                  erro.message ||
                  'Não foi possível carregar a carteira.'
                )
              }
            </p>

          </div>

        </div>

      `;

    }

  }


  // ====================================================
  // SERVICE WORKER
  // ====================================================

  if (
    'serviceWorker' in navigator
  ) {

    window.addEventListener(
      'load',
      function() {

        navigator
          .serviceWorker
          .register(
            './service-worker.js?v=4',
            {
              scope: './'
            }
          )
          .catch(
            function(erro) {

              console.warn(
                'Service Worker:',
                erro
              );

            }
          );

      }
    );

  }


  iniciar();

</script>

</html>
